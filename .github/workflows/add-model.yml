name: Add New Model

on:
  workflow_dispatch:
    inputs:
      model_category:
        description: 'Model Category (e.g., scripts, tools)'
        required: true
        type: string
      model_name:
        description: 'Model Name'
        required: true
        type: string
      model_link:
        description: 'Model Link'
        required: true
        type: string
      model_status:
        description: 'Model Status'
        required: true
        type: string
      image_link:
        description: 'Image URL'
        required: true
        type: string

jobs:
  add-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add model to index.html
        run: |
          python3 -c '
          with open("index.html", "r", encoding="utf-8") as f:
              content = f.read()
          
          category = "${{ github.event.inputs.model_category }}"
          name = "${{ github.event.inputs.model_name }}"
          link = "${{ github.event.inputs.model_link }}"
          status = "${{ github.event.inputs.model_status }}"
          image = "${{ github.event.inputs.image_link }}"

          new_model_html = f"""
          <!-- Model: {name} -->
          <div class=\"model-item\" data-category=\"{category}\">
              <h3>{name}</h3>
              <p>Status: {status}</p>
              <img src=\"{image}\" alt=\"Model Image\">
              <a href=\"{link}\">View Model</a>
          </div>
          """
          
          target_comment = f"<!-- CATEGORY: {category} -->"
          if target_comment in content:
              new_content = content.replace(target_comment, f"{target_comment}\n{new_model_html}")
          elif "<!-- MODELS_CONTAINER -->" in content:
              new_content = content.replace("<!-- MODELS_CONTAINER -->", f"<!-- MODELS_CONTAINER -->\n{new_model_html}")
          else:
              new_content = content + "\n" + new_model_html
              
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add new model: ${{ github.event.inputs.model_name }}"
          branch: main
