name: Toggle Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Set Maintenance Mode (true or false)'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  update-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update index.html maintenance status
        run: |
          # Replace maintenance mode status in index.html based on selection
          sed -i 's/const MAINTENANCE_MODE = (true|false);/const MAINTENANCE_MODE = ${{ github.event.inputs.status }};/g' index.html
          
          # Commit and push the changes to the repository
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git commit -am "Workflow: Set maintenance mode to ${{ github.event.inputs.status }}"
          git push
